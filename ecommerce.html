<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>E-Commerce Web Application</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React & ReactDOM -->
    <script
      src="https://unpkg.com/react@18/umd/react.development.js"
      crossorigin
    ></script>
    <script
      src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"
      crossorigin
    ></script>

    <!-- Babel for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");
      body {
        font-family: "Inter", sans-serif;
      }
    </style>
  </head>
  <body class="bg-gray-50 text-gray-800">
    <div id="root"></div>

    <script type="text/babel">
      const { useState, useEffect } = React;

      // Initial Default Data
      const INITIAL_PRODUCTS = [
        {
          id: 1,
          name: "Wireless Noise-Canceling Headphones",
          price: 199.99,
          category: "Electronics",
          stock: 15,
          rating: 4.8,
          image:
            "https://images.unsplash.com/photo-1505740420928-5e560c06d30e?auto=format&fit=crop&w=500&q=80",
          description:
            "Premium wireless over-ear headphones with active noise cancellation and 30-hour battery life.",
        },
        {
          id: 2,
          name: "Minimalist Leather Smartwatch",
          price: 149.5,
          category: "Electronics",
          stock: 8,
          rating: 4.5,
          image:
            "https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=500&q=80",
          description:
            "Elegant smartwatch featuring heart rate monitoring, sleep tracking, and custom watch faces.",
        },
        {
          id: 3,
          name: "Ergonomic Mechanical Keyboard",
          price: 89.99,
          category: "Accessories",
          stock: 20,
          rating: 4.7,
          image:
            "https://images.unsplash.com/photo-1587829741301-dc798b83add3?auto=format&fit=crop&w=500&q=80",
          description:
            "RGB backlit mechanical keyboard with tactile switches for high productivity and gaming.",
        },
        {
          id: 4,
          name: "Stainless Steel Water Bottle",
          price: 24.99,
          category: "Lifestyle",
          stock: 45,
          rating: 4.9,
          image:
            "https://images.unsplash.com/photo-1602143407151-7111542de6e8?auto=format&fit=crop&w=500&q=80",
          description:
            "Double-wall insulated bottle that keeps beverages cold for 24 hours or hot for 12 hours.",
        },
        {
          id: 5,
          name: "Canvas Everyday Backpack",
          price: 59.99,
          category: "Lifestyle",
          stock: 12,
          rating: 4.6,
          image:
            "https://images.unsplash.com/photo-1553062407-98eeb64c6a62?auto=format&fit=crop&w=500&q=80",
          description:
            "Durable water-resistant canvas backpack with a dedicated laptop compartment.",
        },
        {
          id: 6,
          name: "Aromatic Soy Candle Set",
          price: 34.0,
          category: "Home",
          stock: 3,
          rating: 4.4,
          image:
            "https://images.unsplash.com/photo-1603006905003-be475563bc59?auto=format&fit=crop&w=500&q=80",
          description:
            "Set of 3 hand-poured natural soy candles with lavender, vanilla, and cedarwood scents.",
        },
      ];

      const INITIAL_ORDERS = [
        {
          id: "ORD-9821",
          date: "2023-10-24",
          items: [
            {
              name: "Wireless Noise-Canceling Headphones",
              qty: 1,
              price: 199.99,
            },
          ],
          total: 199.99,
          status: "Delivered",
          customer: "Jane Doe",
        },
        {
          id: "ORD-9822",
          date: "2023-10-25",
          items: [
            { name: "Minimalist Leather Smartwatch", qty: 1, price: 149.5 },
            { name: "Stainless Steel Water Bottle", qty: 2, price: 24.99 },
          ],
          total: 199.48,
          status: "Shipped",
          customer: "John Smith",
        },
        {
          id: "ORD-9823",
          date: "2023-10-26",
          items: [
            { name: "Ergonomic Mechanical Keyboard", qty: 1, price: 89.99 },
          ],
          total: 89.99,
          status: "Processing",
          customer: "Alex Johnson",
        },
      ];

      function App() {
        // Persistence State
        const [products, setProducts] = useState(() => {
          const saved = localStorage.getItem("ecom_products");
          return saved ? JSON.parse(saved) : INITIAL_PRODUCTS;
        });

        const [orders, setOrders] = useState(() => {
          const saved = localStorage.getItem("ecom_orders");
          return saved ? JSON.parse(saved) : INITIAL_ORDERS;
        });

        const [cart, setCart] = useState(() => {
          const saved = localStorage.getItem("ecom_cart");
          return saved ? JSON.parse(saved) : [];
        });

        // App Mode & Navigation State
        const [userRole, setUserRole] = useState("User"); // 'User' or 'Admin'
        const [activeTab, setActiveTab] = useState("shop"); // 'shop', 'orders', 'admin-products', 'admin-orders'
        const [isCartOpen, setIsCartOpen] = useState(false);
        const [showTutorial, setShowTutorial] = useState(false);

        // Filter & Search State
        const [searchQuery, setSearchQuery] = useState("");
        const [selectedCategory, setSelectedCategory] = useState("All");
        const [maxPrice, setMaxPrice] = useState(250);

        // Product Form Modal State (Admin)
        const [isProductModalOpen, setIsProductModalOpen] = useState(false);
        const [editingProduct, setEditingProduct] = useState(null);
        const [productFormData, setProductFormData] = useState({
          name: "",
          price: "",
          category: "Electronics",
          stock: "",
          description: "",
          image: "",
        });

        // Notification / Toast
        const [toast, setToast] = useState(null);

        useEffect(() => {
          localStorage.setItem("ecom_products", JSON.stringify(products));
        }, [products]);

        useEffect(() => {
          localStorage.setItem("ecom_orders", JSON.stringify(orders));
        }, [orders]);

        useEffect(() => {
          localStorage.setItem("ecom_cart", JSON.stringify(cart));
        }, [cart]);

        useEffect(() => {
          if (window.lucide) {
            window.lucide.createIcons();
          }
        });

        const showNotification = (msg) => {
          setToast(msg);
          setTimeout(() => setToast(null), 3000);
        };

        // Cart Functions
        const addToCart = (product) => {
          if (product.stock <= 0) {
            showNotification("Sorry, product is out of stock!");
            return;
          }
          setCart((prev) => {
            const existing = prev.find((item) => item.id === product.id);
            if (existing) {
              if (existing.qty >= product.stock) {
                showNotification("Cannot add more than available stock!");
                return prev;
              }
              return prev.map((item) =>
                item.id === product.id ? { ...item, qty: item.qty + 1 } : item,
              );
            }
            return [...prev, { ...product, qty: 1 }];
          });
          showNotification(`Added ${product.name} to cart!`);
        };

        const updateCartQty = (id, delta) => {
          setCart((prev) =>
            prev.map((item) => {
              if (item.id === id) {
                const newQty = item.qty + delta;
                return newQty > 0 ? { ...item, qty: newQty } : item;
              }
              return item;
            }),
          );
        };

        const removeFromCart = (id) => {
          setCart((prev) => prev.filter((item) => item.id !== id));
        };

        const handleCheckout = () => {
          if (cart.length === 0) return;

          const newOrder = {
            id: `ORD-${Math.floor(1000 + Math.random() * 9000)}`,
            date: new Date().toISOString().split("T")[0],
            items: cart.map((i) => ({
              name: i.name,
              qty: i.qty,
              price: i.price,
            })),
            total: cart.reduce((sum, item) => sum + item.price * item.qty, 0),
            status: "Pending",
            customer: userRole === "Admin" ? "Admin User" : "Customer User",
          };

          // Update product inventory stock
          setProducts((prev) =>
            prev.map((prod) => {
              const cartItem = cart.find((c) => c.id === prod.id);
              if (cartItem) {
                return { ...prod, stock: prod.stock - cartItem.qty };
              }
              return prod;
            }),
          );

          setOrders([newOrder, ...orders]);
          setCart([]);
          setIsCartOpen(false);
          setActiveTab("orders");
          showNotification(`Order ${newOrder.id} placed successfully!`);
        };

        // Admin Management Functions
        const openAddProduct = () => {
          setEditingProduct(null);
          setProductFormData({
            name: "",
            price: "",
            category: "Electronics",
            stock: "",
            description: "",
            image: "",
          });
          setIsProductModalOpen(true);
        };

        const openEditProduct = (prod) => {
          setEditingProduct(prod);
          setProductFormData({
            name: prod.name,
            price: prod.price,
            category: prod.category,
            stock: prod.stock,
            description: prod.description,
            image: prod.image,
          });
          setIsProductModalOpen(true);
        };

        const handleSaveProduct = (e) => {
          e.preventDefault();
          if (!productFormData.name || !productFormData.price) return;

          if (editingProduct) {
            setProducts(
              products.map((p) =>
                p.id === editingProduct.id
                  ? {
                      ...p,
                      ...productFormData,
                      price: parseFloat(productFormData.price),
                      stock: parseInt(productFormData.stock || 0),
                    }
                  : p,
              ),
            );
            showNotification("Product updated!");
          } else {
            const newProd = {
              id: Date.now(),
              ...productFormData,
              price: parseFloat(productFormData.price),
              stock: parseInt(productFormData.stock || 0),
              rating: 5.0,
              image:
                productFormData.image ||
                "https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=500&q=80",
            };
            setProducts([newProd, ...products]);
            showNotification("New product created!");
          }
          setIsProductModalOpen(false);
        };

        const handleDeleteProduct = (id) => {
          if (confirm("Are you sure you want to delete this product?")) {
            setProducts(products.filter((p) => p.id !== id));
            showNotification("Product deleted.");
          }
        };

        const handleUpdateOrderStatus = (orderId, newStatus) => {
          setOrders(
            orders.map((o) =>
              o.id === orderId ? { ...o, status: newStatus } : o,
            ),
          );
          showNotification(`Order ${orderId} status changed to ${newStatus}`);
        };

        // Filtering logic
        const filteredProducts = products.filter((p) => {
          const matchesCategory =
            selectedCategory === "All" || p.category === selectedCategory;
          const matchesSearch =
            p.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
            p.description.toLowerCase().includes(searchQuery.toLowerCase());
          const matchesPrice = p.price <= maxPrice;
          return matchesCategory && matchesSearch && matchesPrice;
        });

        const categories = ["All", ...new Set(products.map((p) => p.category))];

        return (
          <div class="min-h-screen flex flex-col bg-slate-50">
            {/* Toast Notification */}
            {toast && (
              <div class="fixed top-20 right-5 z-50 bg-gray-900 text-white px-4 py-3 rounded-xl shadow-lg flex items-center space-x-2 animate-bounce">
                <i
                  data-lucide="check-circle"
                  class="w-5 h-5 text-green-400"
                ></i>
                <span class="text-sm font-medium">{toast}</span>
              </div>
            )}

            {/* Top Navbar */}
            <header class="bg-white border-b border-slate-200 sticky top-0 z-30 shadow-sm">
              <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                <div class="flex justify-between h-16 items-center">
                  {/* Brand & Tutorial Button */}
                  <div class="flex items-center space-x-4">
                    <div
                      class="flex items-center space-x-2 cursor-pointer"
                      onClick={() => setActiveTab("shop")}
                    >
                      <div class="bg-blue-600 text-white p-2 rounded-xl">
                        <i data-lucide="shopping-bag" class="w-6 h-6"></i>
                      </div>
                      <span class="font-bold text-xl text-slate-800 tracking-tight">
                        ShopPulse
                      </span>
                    </div>

                    {/* Tutorial Button requested in mockup */}
                    <button
                      onClick={() => setShowTutorial(true)}
                      class="hidden sm:flex items-center space-x-1.5 text-xs font-semibold bg-red-50 text-red-600 border border-red-200 px-3 py-1.5 rounded-full hover:bg-red-100 transition-colors"
                    >
                      <i data-lucide="youtube" class="w-4 h-4 text-red-600"></i>
                      <span>Watch Task Tutorial</span>
                    </button>
                  </div>

                  {/* Role Switcher & Dynamic Navigation */}
                  <div class="flex items-center space-x-4">
                    {/* Role Toggle Switcher */}
                    <div class="bg-slate-100 p-1 rounded-xl flex items-center border border-slate-200 text-xs font-medium">
                      <button
                        onClick={() => {
                          setUserRole("User");
                          setActiveTab("shop");
                        }}
                        class={`px-3 py-1.5 rounded-lg transition-all ${userRole === "User" ? "bg-white shadow text-blue-600 font-semibold" : "text-slate-600 hover:text-slate-900"}`}
                      >
                        Customer Mode
                      </button>
                      <button
                        onClick={() => {
                          setUserRole("Admin");
                          setActiveTab("admin-products");
                        }}
                        class={`px-3 py-1.5 rounded-lg transition-all ${userRole === "Admin" ? "bg-white shadow text-blue-600 font-semibold" : "text-slate-600 hover:text-slate-900"}`}
                      >
                        Admin Mode
                      </button>
                    </div>

                    {/* Links based on User Role */}
                    {userRole === "User" ? (
                      <div class="flex items-center space-x-2">
                        <button
                          onClick={() => setActiveTab("shop")}
                          class={`px-3 py-2 rounded-lg text-sm font-medium ${activeTab === "shop" ? "text-blue-600 bg-blue-50" : "text-slate-600 hover:text-slate-900"}`}
                        >
                          Products
                        </button>
                        <button
                          onClick={() => setActiveTab("orders")}
                          class={`px-3 py-2 rounded-lg text-sm font-medium ${activeTab === "orders" ? "text-blue-600 bg-blue-50" : "text-slate-600 hover:text-slate-900"}`}
                        >
                          My Orders
                        </button>

                        {/* Cart Icon */}
                        <button
                          onClick={() => setIsCartOpen(true)}
                          class="relative p-2 text-slate-600 hover:text-slate-900 bg-slate-100 rounded-xl hover:bg-slate-200 transition"
                        >
                          <i data-lucide="shopping-cart" class="w-5 h-5"></i>
                          {cart.length > 0 && (
                            <span class="absolute -top-1 -right-1 bg-blue-600 text-white text-xs font-bold rounded-full h-5 w-5 flex items-center justify-center">
                              {cart.reduce((a, b) => a + b.qty, 0)}
                            </span>
                          )}
                        </button>
                      </div>
                    ) : (
                      <div class="flex items-center space-x-2">
                        <button
                          onClick={() => setActiveTab("admin-products")}
                          class={`px-3 py-2 rounded-lg text-sm font-medium ${activeTab === "admin-products" ? "text-blue-600 bg-blue-50" : "text-slate-600 hover:text-slate-900"}`}
                        >
                          Inventory DB
                        </button>
                        <button
                          onClick={() => setActiveTab("admin-orders")}
                          class={`px-3 py-2 rounded-lg text-sm font-medium ${activeTab === "admin-orders" ? "text-blue-600 bg-blue-50" : "text-slate-600 hover:text-slate-900"}`}
                        >
                          Manage Orders ({orders.length})
                        </button>
                      </div>
                    )}
                  </div>
                </div>
              </div>
            </header>

            {/* MAIN CONTENT AREA */}
            <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-8">
              {/* CUSTOMER SHOP VIEW */}
              {userRole === "User" && activeTab === "shop" && (
                <div>
                  {/* Search & Filter Bar */}
                  <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-200 mb-8 flex flex-col md:flex-row gap-4 items-center justify-between">
                    {/* Search Input */}
                    <div class="relative w-full md:w-96">
                      <i
                        data-lucide="search"
                        class="w-5 h-5 absolute left-3 top-1/2 -translate-y-1/2 text-slate-400"
                      ></i>
                      <input
                        type="text"
                        placeholder="Search products..."
                        value={searchQuery}
                        onChange={(e) => setSearchQuery(e.target.value)}
                        class="w-full pl-10 pr-4 py-2 border border-slate-200 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-500 text-sm"
                      />
                    </div>

                    {/* Category Filter Pills */}
                    <div class="flex flex-wrap gap-2 w-full md:w-auto">
                      {categories.map((cat) => (
                        <button
                          key={cat}
                          onClick={() => setSelectedCategory(cat)}
                          class={`px-3 py-1.5 text-xs font-semibold rounded-lg transition-colors ${selectedCategory === cat ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-600 hover:bg-slate-200"}`}
                        >
                          {cat}
                        </button>
                      ))}
                    </div>

                    {/* Price Slider */}
                    <div class="flex items-center space-x-3 w-full md:w-auto">
                      <span class="text-xs font-medium text-slate-500">
                        Max: ${maxPrice}
                      </span>
                      <input
                        type="range"
                        min="10"
                        max="300"
                        step="10"
                        value={maxPrice}
                        onChange={(e) => setMaxPrice(e.target.value)}
                        class="w-32 accent-blue-600 cursor-pointer"
                      />
                    </div>
                  </div>

                  {/* Product Grid */}
                  {filteredProducts.length === 0 ? (
                    <div class="text-center py-16 bg-white rounded-2xl border border-dashed border-slate-300">
                      <i
                        data-lucide="package-x"
                        class="w-12 h-12 text-slate-300 mx-auto mb-3"
                      ></i>
                      <h3 class="text-lg font-semibold text-slate-700">
                        No products found
                      </h3>
                      <p class="text-slate-400 text-sm">
                        Try tweaking your search or price filters.
                      </p>
                    </div>
                  ) : (
                    <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                      {filteredProducts.map((prod) => (
                        <div
                          key={prod.id}
                          class="bg-white rounded-2xl overflow-hidden border border-slate-200 shadow-sm hover:shadow-md transition group flex flex-col"
                        >
                          <div class="relative h-48 bg-slate-100 overflow-hidden">
                            <img
                              src={prod.image}
                              alt={prod.name}
                              class="w-full h-full object-cover group-hover:scale-105 transition duration-300"
                            />
                            <span class="absolute top-3 right-3 bg-white/90 backdrop-blur-sm text-slate-800 text-xs font-bold px-2.5 py-1 rounded-md">
                              ${prod.price.toFixed(2)}
                            </span>
                            {prod.stock <= 5 && prod.stock > 0 && (
                              <span class="absolute top-3 left-3 bg-amber-500 text-white text-xs font-semibold px-2 py-0.5 rounded">
                                Only {prod.stock} left!
                              </span>
                            )}
                            {prod.stock === 0 && (
                              <span class="absolute top-3 left-3 bg-red-600 text-white text-xs font-semibold px-2 py-0.5 rounded">
                                Out of Stock
                              </span>
                            )}
                          </div>

                          <div class="p-5 flex-1 flex flex-col justify-between">
                            <div>
                              <div class="flex justify-between items-start mb-2">
                                <span class="text-xs font-semibold text-blue-600 uppercase tracking-wider">
                                  {prod.category}
                                </span>
                                <div class="flex items-center text-amber-500 text-xs font-bold">
                                  <i
                                    data-lucide="star"
                                    class="w-3.5 h-3.5 fill-current mr-1"
                                  ></i>
                                  {prod.rating || 4.5}
                                </div>
                              </div>
                              <h3 class="font-bold text-slate-800 text-base mb-1 line-clamp-1">
                                {prod.name}
                              </h3>
                              <p class="text-slate-500 text-xs mb-4 line-clamp-2">
                                {prod.description}
                              </p>
                            </div>

                            <div class="pt-3 border-t border-slate-100 flex items-center justify-between">
                              <span class="text-xs text-slate-500">
                                Stock:{" "}
                                <strong class="text-slate-700">
                                  {prod.stock}
                                </strong>
                              </span>
                              <button
                                onClick={() => addToCart(prod)}
                                disabled={prod.stock === 0}
                                class={`px-4 py-2 rounded-xl text-xs font-semibold flex items-center space-x-1.5 transition ${
                                  prod.stock > 0
                                    ? "bg-blue-600 text-white hover:bg-blue-700"
                                    : "bg-slate-200 text-slate-400 cursor-not-allowed"
                                }`}
                              >
                                <i
                                  data-lucide="shopping-cart"
                                  class="w-4 h-4"
                                ></i>
                                <span>
                                  {prod.stock > 0 ? "Add to Cart" : "Sold Out"}
                                </span>
                              </button>
                            </div>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* CUSTOMER ORDER TRACKING VIEW */}
              {userRole === "User" && activeTab === "orders" && (
                <div class="max-w-4xl mx-auto">
                  <h2 class="text-2xl font-bold text-slate-800 mb-6">
                    Order Tracking & History
                  </h2>

                  {orders.length === 0 ? (
                    <div class="text-center py-12 bg-white rounded-2xl border border-slate-200">
                      <p class="text-slate-500">No orders placed yet.</p>
                    </div>
                  ) : (
                    <div class="space-y-6">
                      {orders.map((order) => (
                        <div
                          key={order.id}
                          class="bg-white rounded-2xl p-6 border border-slate-200 shadow-sm"
                        >
                          <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center pb-4 border-b border-slate-100 gap-2">
                            <div>
                              <span class="text-xs text-slate-400 uppercase font-semibold">
                                Order ID
                              </span>
                              <h4 class="text-lg font-bold text-slate-800">
                                {order.id}
                              </h4>
                              <p class="text-xs text-slate-500">
                                Placed on {order.date}
                              </p>
                            </div>
                            <div class="text-right">
                              <span class="text-xs text-slate-400 block">
                                Total Amount
                              </span>
                              <span class="text-lg font-bold text-blue-600">
                                ${order.total.toFixed(2)}
                              </span>
                            </div>
                          </div>

                          {/* Order Progress Bar */}
                          <div class="py-6">
                            <div class="text-xs font-semibold text-slate-500 mb-3">
                              Status:{" "}
                              <span class="text-blue-600">{order.status}</span>
                            </div>
                            <div class="relative flex items-center justify-between">
                              <div class="absolute left-0 top-1/2 -translate-y-1/2 w-full h-1 bg-slate-100 -z-0"></div>

                              {[
                                "Pending",
                                "Processing",
                                "Shipped",
                                "Delivered",
                              ].map((st, idx) => {
                                const statuses = [
                                  "Pending",
                                  "Processing",
                                  "Shipped",
                                  "Delivered",
                                ];
                                const currentIdx = statuses.indexOf(
                                  order.status,
                                );
                                const isCompleted = idx <= currentIdx;

                                return (
                                  <div
                                    key={st}
                                    class="relative z-10 flex flex-col items-center"
                                  >
                                    <div
                                      class={`w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold transition-all ${
                                        isCompleted
                                          ? "bg-blue-600 text-white ring-4 ring-blue-50"
                                          : "bg-slate-200 text-slate-500"
                                      }`}
                                    >
                                      {idx + 1}
                                    </div>
                                    <span
                                      class={`text-[10px] sm:text-xs font-medium mt-1 ${isCompleted ? "text-slate-800 font-bold" : "text-slate-400"}`}
                                    >
                                      {st}
                                    </span>
                                  </div>
                                );
                              })}
                            </div>
                          </div>

                          {/* Items list */}
                          <div class="bg-slate-50 rounded-xl p-4 text-xs space-y-2">
                            {order.items.map((it, idx) => (
                              <div
                                key={idx}
                                class="flex justify-between items-center text-slate-700"
                              >
                                <span>
                                  {it.qty}x <strong>{it.name}</strong>
                                </span>
                                <span>${(it.price * it.qty).toFixed(2)}</span>
                              </div>
                            ))}
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              )}

              {/* ADMIN INVENTORY MANAGEMENT VIEW */}
              {userRole === "Admin" && activeTab === "admin-products" && (
                <div>
                  <div class="flex justify-between items-center mb-6">
                    <div>
                      <h2 class="text-2xl font-bold text-slate-800">
                        Product Management API / DB
                      </h2>
                      <p class="text-xs text-slate-500">
                        Create, edit, or remove store products from backend
                        database.
                      </p>
                    </div>
                    <button
                      onClick={openAddProduct}
                      class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-sm font-semibold flex items-center space-x-2 shadow-sm"
                    >
                      <i data-lucide="plus" class="w-4 h-4"></i>
                      <span>Add New Product</span>
                    </button>
                  </div>

                  {/* Dashboard Metrics */}
                  <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 mb-6">
                    <div class="bg-white p-5 rounded-2xl border border-slate-200">
                      <span class="text-xs font-medium text-slate-400 block">
                        Total Catalog Items
                      </span>
                      <span class="text-2xl font-extrabold text-slate-800">
                        {products.length}
                      </span>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-200">
                      <span class="text-xs font-medium text-slate-400 block">
                        Low Stock Alert (&lt; 5)
                      </span>
                      <span class="text-2xl font-extrabold text-amber-500">
                        {products.filter((p) => p.stock < 5).length}
                      </span>
                    </div>
                    <div class="bg-white p-5 rounded-2xl border border-slate-200">
                      <span class="text-xs font-medium text-slate-400 block">
                        Total Store Sales
                      </span>
                      <span class="text-2xl font-extrabold text-green-600">
                        $
                        {orders.reduce((sum, o) => sum + o.total, 0).toFixed(2)}
                      </span>
                    </div>
                  </div>

                  {/* Product Data Table */}
                  <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <table class="w-full text-left border-collapse">
                      <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase">
                          <th class="p-4">Product</th>
                          <th class="p-4">Category</th>
                          <th class="p-4">Price</th>
                          <th class="p-4">Stock</th>
                          <th class="p-4 text-right">Actions</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-100 text-sm">
                        {products.map((p) => (
                          <tr key={p.id} class="hover:bg-slate-50/50">
                            <td class="p-4 flex items-center space-x-3">
                              <img
                                src={p.image}
                                class="w-10 h-10 rounded-lg object-cover bg-slate-100"
                              />
                              <div>
                                <div class="font-semibold text-slate-800">
                                  {p.name}
                                </div>
                                <div class="text-xs text-slate-400 line-clamp-1">
                                  {p.description}
                                </div>
                              </div>
                            </td>
                            <td class="p-4">
                              <span class="bg-slate-100 text-slate-600 text-xs font-medium px-2 py-1 rounded">
                                {p.category}
                              </span>
                            </td>
                            <td class="p-4 font-semibold">
                              ${p.price.toFixed(2)}
                            </td>
                            <td class="p-4">
                              <span
                                class={`font-bold text-xs ${p.stock < 5 ? "text-red-500" : "text-slate-700"}`}
                              >
                                {p.stock} units
                              </span>
                            </td>
                            <td class="p-4 text-right space-x-2">
                              <button
                                onClick={() => openEditProduct(p)}
                                class="p-2 text-slate-500 hover:text-blue-600 hover:bg-slate-100 rounded-lg"
                              >
                                <i data-lucide="edit-3" class="w-4 h-4"></i>
                              </button>
                              <button
                                onClick={() => handleDeleteProduct(p.id)}
                                class="p-2 text-slate-500 hover:text-red-600 hover:bg-slate-100 rounded-lg"
                              >
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                              </button>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}

              {/* ADMIN ORDERS MANAGEMENT VIEW */}
              {userRole === "Admin" && activeTab === "admin-orders" && (
                <div class="max-w-5xl mx-auto">
                  <h2 class="text-2xl font-bold text-slate-800 mb-6">
                    Customer Order Fulfillment
                  </h2>

                  <div class="bg-white rounded-2xl border border-slate-200 overflow-hidden shadow-sm">
                    <table class="w-full text-left border-collapse">
                      <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-xs font-semibold text-slate-500 uppercase">
                          <th class="p-4">Order ID</th>
                          <th class="p-4">Customer</th>
                          <th class="p-4">Date</th>
                          <th class="p-4">Total</th>
                          <th class="p-4">Status</th>
                          <th class="p-4 text-right">Update Status</th>
                        </tr>
                      </thead>
                      <tbody class="divide-y divide-slate-100 text-sm">
                        {orders.map((order) => (
                          <tr key={order.id}>
                            <td class="p-4 font-bold text-slate-800">
                              {order.id}
                            </td>
                            <td class="p-4 text-slate-600">{order.customer}</td>
                            <td class="p-4 text-slate-500 text-xs">
                              {order.date}
                            </td>
                            <td class="p-4 font-bold text-blue-600">
                              ${order.total.toFixed(2)}
                            </td>
                            <td class="p-4">
                              <span
                                class={`text-xs font-bold px-2.5 py-1 rounded-full ${
                                  order.status === "Delivered"
                                    ? "bg-green-100 text-green-700"
                                    : order.status === "Shipped"
                                      ? "bg-blue-100 text-blue-700"
                                      : order.status === "Processing"
                                        ? "bg-amber-100 text-amber-700"
                                        : "bg-slate-100 text-slate-700"
                                }`}
                              >
                                {order.status}
                              </span>
                            </td>
                            <td class="p-4 text-right">
                              <select
                                value={order.status}
                                onChange={(e) =>
                                  handleUpdateOrderStatus(
                                    order.id,
                                    e.target.value,
                                  )
                                }
                                class="text-xs border border-slate-200 rounded-lg p-1.5 focus:outline-none focus:ring-2 focus:ring-blue-500"
                              >
                                <option value="Pending">Pending</option>
                                <option value="Processing">Processing</option>
                                <option value="Shipped">Shipped</option>
                                <option value="Delivered">Delivered</option>
                              </select>
                            </td>
                          </tr>
                        ))}
                      </tbody>
                    </table>
                  </div>
                </div>
              )}
            </main>

            {/* SHOPPING CART DRAWER (SLIDE OVER) */}
            {isCartOpen && (
              <div class="fixed inset-0 z-50 overflow-hidden bg-slate-900/40 backdrop-blur-sm flex justify-end">
                <div class="w-full max-w-md bg-white h-full shadow-2xl flex flex-col justify-between p-6 animate-in slide-in-from-right duration-200">
                  <div>
                    <div class="flex justify-between items-center border-b border-slate-100 pb-4">
                      <h3 class="text-lg font-bold text-slate-800 flex items-center space-x-2">
                        <i
                          data-lucide="shopping-bag"
                          class="w-5 h-5 text-blue-600"
                        ></i>
                        <span>Your Shopping Cart</span>
                      </h3>
                      <button
                        onClick={() => setIsCartOpen(false)}
                        class="p-1 hover:bg-slate-100 rounded-lg text-slate-400"
                      >
                        <i data-lucide="x" class="w-5 h-5"></i>
                      </button>
                    </div>

                    {/* Cart Items List */}
                    <div class="mt-6 space-y-4 max-h-[60vh] overflow-y-auto pr-1">
                      {cart.length === 0 ? (
                        <div class="text-center py-12">
                          <i
                            data-lucide="shopping-cart"
                            class="w-12 h-12 text-slate-200 mx-auto mb-2"
                          ></i>
                          <p class="text-slate-400 text-sm">
                            Your cart is empty.
                          </p>
                        </div>
                      ) : (
                        cart.map((item) => (
                          <div
                            key={item.id}
                            class="flex justify-between items-center bg-slate-50 p-3 rounded-xl"
                          >
                            <img
                              src={item.image}
                              class="w-12 h-12 rounded-lg object-cover"
                            />
                            <div class="flex-1 ml-3">
                              <h4 class="text-xs font-semibold text-slate-800 line-clamp-1">
                                {item.name}
                              </h4>
                              <span class="text-xs font-bold text-blue-600">
                                ${(item.price * item.qty).toFixed(2)}
                              </span>
                            </div>

                            <div class="flex items-center space-x-2">
                              <div class="flex items-center border border-slate-200 rounded-lg bg-white">
                                <button
                                  onClick={() => updateCartQty(item.id, -1)}
                                  class="px-2 py-0.5 text-slate-600 hover:bg-slate-100 text-xs"
                                >
                                  -
                                </button>
                                <span class="px-2 text-xs font-bold">
                                  {item.qty}
                                </span>
                                <button
                                  onClick={() => updateCartQty(item.id, 1)}
                                  class="px-2 py-0.5 text-slate-600 hover:bg-slate-100 text-xs"
                                >
                                  +
                                </button>
                              </div>
                              <button
                                onClick={() => removeFromCart(item.id)}
                                class="text-red-400 hover:text-red-600 p-1"
                              >
                                <i data-lucide="trash-2" class="w-4 h-4"></i>
                              </button>
                            </div>
                          </div>
                        ))
                      )}
                    </div>
                  </div>

                  {/* Cart Footer */}
                  {cart.length > 0 && (
                    <div class="border-t border-slate-100 pt-4 space-y-4">
                      <div class="flex justify-between text-sm">
                        <span class="text-slate-500">Subtotal</span>
                        <span class="font-bold text-slate-800">
                          $
                          {cart
                            .reduce(
                              (sum, item) => sum + item.price * item.qty,
                              0,
                            )
                            .toFixed(2)}
                        </span>
                      </div>
                      <button
                        onClick={handleCheckout}
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl text-sm transition shadow-md"
                      >
                        Complete Checkout
                      </button>
                    </div>
                  )}
                </div>
              </div>
            )}

            {/* ADMIN PRODUCT EDIT/ADD MODAL */}
            {isProductModalOpen && (
              <div class="fixed inset-0 z-50 bg-slate-900/50 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl">
                  <div class="flex justify-between items-center mb-4 border-b border-slate-100 pb-3">
                    <h3 class="font-bold text-slate-800 text-lg">
                      {editingProduct ? "Edit Product" : "Add New Product"}
                    </h3>
                    <button
                      onClick={() => setIsProductModalOpen(false)}
                      class="text-slate-400 hover:text-slate-600"
                    >
                      <i data-lucide="x" class="w-5 h-5"></i>
                    </button>
                  </div>

                  <form onSubmit={handleSaveProduct} class="space-y-4">
                    <div>
                      <label class="block text-xs font-semibold text-slate-600 mb-1">
                        Product Title
                      </label>
                      <input
                        type="text"
                        required
                        value={productFormData.name}
                        onChange={(e) =>
                          setProductFormData({
                            ...productFormData,
                            name: e.target.value,
                          })
                        }
                        class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none"
                      />
                    </div>

                    <div class="grid grid-cols-2 gap-3">
                      <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">
                          Price ($)
                        </label>
                        <input
                          type="number"
                          step="0.01"
                          required
                          value={productFormData.price}
                          onChange={(e) =>
                            setProductFormData({
                              ...productFormData,
                              price: e.target.value,
                            })
                          }
                          class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none"
                        />
                      </div>
                      <div>
                        <label class="block text-xs font-semibold text-slate-600 mb-1">
                          Stock Qty
                        </label>
                        <input
                          type="number"
                          required
                          value={productFormData.stock}
                          onChange={(e) =>
                            setProductFormData({
                              ...productFormData,
                              stock: e.target.value,
                            })
                          }
                          class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none"
                        />
                      </div>
                    </div>

                    <div>
                      <label class="block text-xs font-semibold text-slate-600 mb-1">
                        Category
                      </label>
                      <select
                        value={productFormData.category}
                        onChange={(e) =>
                          setProductFormData({
                            ...productFormData,
                            category: e.target.value,
                          })
                        }
                        class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none"
                      >
                        <option value="Electronics">Electronics</option>
                        <option value="Accessories">Accessories</option>
                        <option value="Lifestyle">Lifestyle</option>
                        <option value="Home">Home</option>
                      </select>
                    </div>

                    <div>
                      <label class="block text-xs font-semibold text-slate-600 mb-1">
                        Image URL
                      </label>
                      <input
                        type="text"
                        placeholder="https://..."
                        value={productFormData.image}
                        onChange={(e) =>
                          setProductFormData({
                            ...productFormData,
                            image: e.target.value,
                          })
                        }
                        class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none"
                      />
                    </div>

                    <div>
                      <label class="block text-xs font-semibold text-slate-600 mb-1">
                        Description
                      </label>
                      <textarea
                        rows="3"
                        value={productFormData.description}
                        onChange={(e) =>
                          setProductFormData({
                            ...productFormData,
                            description: e.target.value,
                          })
                        }
                        class="w-full border border-slate-200 rounded-xl p-2.5 text-xs focus:ring-2 focus:ring-blue-500 outline-none"
                      ></textarea>
                    </div>

                    <div class="pt-2 flex justify-end space-x-2">
                      <button
                        type="button"
                        onClick={() => setIsProductModalOpen(false)}
                        class="px-4 py-2 text-xs font-semibold text-slate-600 bg-slate-100 rounded-xl hover:bg-slate-200"
                      >
                        Cancel
                      </button>
                      <button
                        type="submit"
                        class="px-4 py-2 text-xs font-semibold text-white bg-blue-600 rounded-xl hover:bg-blue-700"
                      >
                        Save Changes
                      </button>
                    </div>
                  </form>
                </div>
              </div>
            )}

            {/* WATCH TASK TUTORIAL MODAL */}
            {showTutorial && (
              <div class="fixed inset-0 z-50 bg-slate-900/60 backdrop-blur-sm flex items-center justify-center p-4">
                <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl relative">
                  <button
                    onClick={() => setShowTutorial(false)}
                    class="absolute top-4 right-4 text-slate-400 hover:text-slate-600 p-1"
                  >
                    <i data-lucide="x" class="w-5 h-5"></i>
                  </button>

                  <div class="flex items-center space-x-2 mb-4">
                    <i data-lucide="youtube" class="w-6 h-6 text-red-600"></i>
                    <h3 class="text-lg font-bold text-slate-800">
                      Task Tutorial Guide
                    </h3>
                  </div>

                  <div class="space-y-3 text-sm text-slate-600 mb-6">
                    <p>
                      This web application implements all key requirements
                      requested in your project specification:
                    </p>
                    <ul class="list-disc pl-5 space-y-1 text-xs text-slate-500">
                      <li>
                        <strong class="text-slate-700">
                          Product Catalog & Checkout:
                        </strong>{" "}
                        Filter by category/price, add items to cart, place
                        orders.
                      </li>
                      <li>
                        <strong class="text-slate-700">
                          Role-Based Access:
                        </strong>{" "}
                        Switch between <i>Customer Mode</i> and{" "}
                        <i>Admin Mode</i> using the top-right toggle.
                      </li>
                      <li>
                        <strong class="text-slate-700">
                          Backend API / DB Simulation:
                        </strong>{" "}
                        Full CRUD operation for items stored via persistent
                        browser{" "}
                        <code class="bg-slate-100 px-1 rounded">
                          localStorage
                        </code>
                        .
                      </li>
                      <li>
                        <strong class="text-slate-700">Order Tracking:</strong>{" "}
                        Live progression status tracking (Pending $\rightarrow$
                        Processing $\rightarrow$ Shipped $\rightarrow$
                        Delivered).
                      </li>
                    </ul>
                  </div>

                  <button
                    onClick={() => setShowTutorial(false)}
                    class="w-full bg-slate-800 text-white font-semibold py-2.5 rounded-xl text-xs hover:bg-slate-900"
                  >
                    Got It!
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
    </script>
  </body>
</html>
